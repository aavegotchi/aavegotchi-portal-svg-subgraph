specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Contract
    network: base-sepolia
    source:
      address: "0x86e527A5863975d0141514D20248aD17B6BF92D0"
      abi: Contract
      startBlock: 24921013
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - ClaimAavegotchi
        - EquipWearables
      abis:
        - name: Contract
          file: ./abis/Contract.json
      eventHandlers:
        - event: PortalOpened(indexed uint256)
          handler: handlePortalOpened
        - event: OpenPortals(uint256[])
          handler: handleOpenPortals
      file: ./src/mapping.ts
