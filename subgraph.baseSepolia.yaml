specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Contract
    network: base-sepolia
    source:
      address: "0x5D2364F343f928159492E79067F1883f1f9DE394"
      abi: Contract
      startBlock: 24921013
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - ClaimAavegotchi
        - EquipWearables
      abis:
        - name: Contract
          file: ./abis/Contract.json
      eventHandlers:
        - event: PortalOpened(indexed uint256)
          handler: handlePortalOpened
        - event: OpenPortals(uint256[])
          handler: handleOpenPortals
        - event: PortalData((uint256,address,uint256,address,(uint8,uint256,int16[6],address,uint256,uint16)[],string,uint256,uint256,uint256,uint256,uint256,uint256[],uint256))
          handler: handlePortalData
      file: ./src/mapping.ts
