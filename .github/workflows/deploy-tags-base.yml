name: Deploy to Satsuma Service on Base

on:
  push:
    tags:
      - "base-*"

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Install node
        uses: actions/setup-node@v1
        with:
          node-version: 18
      - name: Install Yarn
        run: npm i -g yarn
      - name: Install Libs
        run: yarn --frozen-lockfile
      - name: Codegen
        run: yarn codegen:base
      - name: Build
        run: yarn build:base
      - name: Deploy to Satsuma on base
        run: |
          npx graph deploy aavegotchi-portal-svgs-base \
            --deploy-key ${{secrets.SATSUMA_ACCESS_TOKEN}} \
            --node https://subgraphs.alchemy.com/api/subgraphs/deploy \
            --ipfs https://ipfs.satsuma.xyz \
            --version-label ${GITHUB_REF#refs/*/} \
            subgraph.base.yaml
        shell: bash
